<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Đảo Đèn Lồng</title>
  <style>
    /* Bảng màu chuẩn Ticket-02: chữ UI #F5F1E6, viền vàng/điểm #F2C14E, nguy hiểm #FF5A5F, nền trời #0E1430 */
    :root { --ui: #f5f1e6; --gold: #f2c14e; --danger: #ff5a5f; --sky: #0e1430; --mist: #1b2350; --lamp: #ffb347; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); font-family: system-ui, sans-serif; color: var(--ui); font-size: 18px; }
    canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; font-size: 18px; }
    .panel { position: absolute; background: rgba(14, 20, 48, .78); border: 1px solid var(--gold); border-radius: 12px; padding: 6px 14px; font-size: 18px; }
    #tl { top: 12px; left: 12px; }
    #tc { top: 12px; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: 700; letter-spacing: 1px; text-align: center; }
    small { font-size: 18px; }
    #tc small { display: block; font-size: 18px; font-weight: 400; color: var(--gold); }
    #tc.red { color: var(--danger); border-color: var(--danger); animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { 50% { opacity: .35; } }
    #tr { top: 12px; right: 12px; text-align: right; }
    #tr b, #score { color: var(--gold); }
    #bc { bottom: 14px; left: 50%; transform: translateX(-50%); text-align: center; }
    #cells { display: flex; gap: 4px; margin-top: 4px; justify-content: center; }
    .cell { width: 22px; height: 16px; border-radius: 4px; background: rgba(245, 241, 230, .15); border: 1px solid rgba(242, 193, 78, .4); }
    .cell.on { background: #ffe58a; box-shadow: 0 0 8px #fff6c2; }
    #br { bottom: 14px; right: 12px; display: flex; gap: 12px; }
    .cd { position: relative; width: 78px; height: 64px; text-align: center; overflow: hidden; border-radius: 10px; background: rgba(245, 241, 230, .1); border: 1px solid var(--gold); }
    .cd span { position: relative; display: block; font-size: 18px; line-height: 1.15; padding-top: 6px; }
    .cd i { position: absolute; left: 0; bottom: 0; width: 100%; background: rgba(242, 193, 78, .45); }
    .cd.ready { border-color: var(--lamp); box-shadow: 0 0 8px var(--lamp); }
    #prompt { bottom: 110px; left: 50%; transform: translateX(-50%); display: none; }
    #arrow { position: absolute; display: none; font-size: 34px; color: var(--lamp); text-shadow: 0 0 8px #000; }
    #toast { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); font-size: 20px; text-shadow: 0 2px 8px #000; opacity: 0; transition: opacity .3s; }
    #hurt { position: absolute; inset: 0; background: radial-gradient(transparent 50%, rgba(255, 90, 95, .45)); opacity: 0; transition: opacity .4s; }
    #help { position: absolute; bottom: 90px; left: 12px; font-size: 18px; opacity: .85; background: rgba(14, 20, 48, .6); padding: 6px 10px; border-radius: 10px; max-width: 330px; }
    #end, #menu { position: absolute; inset: 0; align-items: center; justify-content: center; flex-direction: column; gap: 12px; pointer-events: auto; text-align: center; font-size: 20px; }
    #end { display: none; background: rgba(14, 20, 48, .82); }
    #menu { display: flex; background: rgba(14, 20, 48, .9); }
    #end h1, #menu h1 { margin: 0 0 8px; font-size: 44px; color: var(--gold); }
    #menu button, #end button { font-size: 20px; padding: 10px 26px; border-radius: 12px; border: 0; background: var(--lamp); color: var(--sky); cursor: pointer; min-width: 280px; }
    #end button.alt { background: var(--mist); color: var(--ui); border: 1px solid var(--gold); }
  </style>
</head>
<body>
  <div id="hud">
    <div id="hurt"></div>
    <div class="panel" id="tl">Ngọn Lửa <b id="flames"></b></div>
    <div class="panel" id="tc"><span id="time"></span><small id="nightname"></small></div>
    <div class="panel" id="tr">Đèn <b id="lit"></b><br />Điểm <b id="score"></b></div>
    <div class="panel" id="bc">Đom đóm <b id="carried"></b><div id="cells"></div></div>
    <div id="br" class="panel">
      <div class="cd" id="cd-dash"><span>Lướt<br /><small>Q</small></span><i></i></div>
      <div class="cd" id="cd-pulse"><span>Tỏa sáng<br /><small>F</small></span><i></i></div>
    </div>
    <div class="panel" id="prompt"></div>
    <div id="arrow">➤</div>
    <div id="toast"></div>
    <div id="help">WASD: đi · Space: nhảy · Q: lướt · E: nạp đèn · F: tỏa sáng · kéo chuột: xoay</div>
    <div id="menu">
      <h1>Đảo Đèn Lồng</h1>
      <div>Mây, người giữ đèn nhỏ tuổi, giữ cho đèn sáng đến bình minh.</div>
      <button data-start="chain">Chơi chuỗi 3 Đêm</button>
      <button data-start="1">Đêm 1 – Đảo Bến</button>
      <button data-start="2">Đêm 2 – Đảo Cau</button>
      <button data-start="3">Đêm 3 – Đảo Chuông</button>
    </div>
    <div id="end">
      <h1 id="end-title"></h1>
      <div id="end-detail"></div>
      <button id="next" style="display:none">Đêm kế tiếp</button>
      <button id="restart">Chơi lại Đêm (Enter)</button>
      <button id="tomenu" class="alt">Về menu</button>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
